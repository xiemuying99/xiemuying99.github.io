<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味学习小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 30px 0;
            color: #222;
        }
        header h1 {
            font-size: 2.4rem;
            margin-bottom: 10px;
        }
        .card-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 12px #00000018;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px #00000022;
        }
        .quiz-box {
            background: #fff;
            border-radius:16px;
            padding:28px;
            margin-top:30px;
        }
        .ans-btn {
            padding:10px 18px;
            margin:8px;
            border:none;
            border-radius:8px;
            background:#54a0ff;
            color:white;
            cursor:pointer;
        }
        .ans-btn:hover{background:#2e86de;}
        .right{background:#1dd1a1 !important;}
        .wrong{background:#ee5a24 !important;}
        .tip{margin-top:16px;font-weight:bold;font-size:18px;}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>✨趣味学习小站✨</h1>
        <p>轻松学知识，快乐涨见识</p >
    </header>
    <div class="card-wrap">
        <div class="card">
            <h3>📖学习小技巧</h3>
            <p>间隔重复法，分时段复习，记得更牢固！</p >
        </div>
        <div class="card">
            <h3>🧠思维训练</h3>
            <p>多问为什么，主动思考比死记硬背更高效</p >
        </div>
        <div class="card">
            <h3>🎯目标规划</h3>
            <p>把大目标拆成每天可以完成的小任务</p >
        </div>
    </div>
    <div class="quiz-box">
        <h3>📝随堂小问答</h3>
        <p>问题：下面哪一个属于高效学习方式？</p >
        <div style="margin-top:15px;">
            <button class="ans-btn" onclick="check(this,'A')">A. 考前临时突击一晚</button>
            <button class="ans-btn" onclick="check(this,'B')">B. 分散时间持续复习</button>
            <button class="ans-btn" onclick="check(this,'C')">C. 一边刷视频一边看书</button>
        </div>
        <div class="tip" id="tip"></div>
    </div>
</div>
<script>
    function check(btn, opt){
        document.querySelectorAll('.ans-btn').forEach(b=>{
            b.classList.remove('right','wrong');
            b.disabled=false;
        })
        if(opt==='B'){
            btn.classList.add('right');
            document.getElementById('tip').innerText="✅回答正确！分散复习记忆效果更好";
        }else{
            btn.classList.add('wrong');
            document.getElementById('tip').innerText="❌不对哦，试试选B";
        }
    }
</script>
</body>
</html>
